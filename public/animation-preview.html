<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Aperçu animation event</title>
<link rel="stylesheet" href="/message-card.css" />
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;background:#08090d;overflow:hidden;font-family:Inter,ui-sans-serif,system-ui,sans-serif;color-scheme:dark}
  body{padding:40px;display:grid;place-items:center}
  #previewWrap{width:100%;display:grid;place-items:center}
  #previewWrap .message-card{width:100%;max-width:980px}
</style>
</head>
<body>
<div id="previewWrap"></div>
<script src="/event-glow-lite.js"></script>
<script type="module">
import { DEFAULT_EVENT_ANIMATION } from './animation-settings.js';
import { createMessageCard, destroyMessageCardAnimation } from './message-card.js';

const wrap=document.querySelector('#previewWrap');
let settings={...DEFAULT_EVENT_ANIMATION};
let style='resub-tier3';
let card=null;

function makeCard(){
  destroyMessageCardAnimation(card);
  wrap.replaceChildren();
  const tier=style.endsWith('tier1')?'Tier 1':style.endsWith('tier2')?'Tier 2':style.endsWith('prime')?'Prime':'Tier 3';
  const message={
    id:`preview-${Date.now()}`,
    platform:'twitch',
    kind:'event',
    eventCategory:'resub',
    eventType:'resub',
    eventStyle:style,
    timestamp:Date.now(),
    author:{name:'JeanMichel',color:'#f3b550',badges:[]},
    content:{text:`s'est réabonné pour son 15e mois (${tier}) ! — Toujours là !`,fragments:[]}
  };
  message.content.fragments=[{type:'text',text:message.content.text}];
  card=createMessageCard(message,{showTimestamp:false,showPlatformBadge:true,animateEvent:true,animationsEnabled:true,animationSettings:settings});
  wrap.append(card);
}

window.addEventListener('message',(event)=>{
  const data=event.data||{};
  if(data.type==='settings'){
    settings={...settings,...data.settings};
    if(data.style) style=data.style;
    makeCard();
  }
  if(data.type==='restart') makeCard();
});
makeCard();
</script>
</body>
</html>
